# ค่าตั้งของท่อประมวลผล (พาธสัมพัทธ์กับราก repo) ค่าของโมเดลอยู่ใน [classify]
pipeline_version = "0.1.0"
max_upload_bytes = 4194304

[paths]
raw = "data/raw"
labeled = "data/labeled"
processed = "data/processed"
models = "models"

# แบ่งชุดตามวัน (Phase 2.1): ทดสอบ = วันล่าสุด test_days วัน, เว้น gap_days, dev = dev_days วัน, เว้น gap_days, ที่เหลือ = ฝึก
[split]
test_days = 7
dev_days = 2
gap_days = 1

[labeling]
# Phase 2.2: สุ่มให้ผู้ใช้ติดป้ายซ้ำแบบไม่เห็นป้าย
blind_fraction = 0.2
blind_seed = 20261117

[classify]
# Phase 2.4: ค่าที่ลองบนชุด dev เท่านั้น · m ของ Naive Bayes = ตัวคูณ x |Vocabulary| (1.0 = add-one)
nb_m_factors = [0.05, 0.1, 0.25, 0.5, 1.0, 2.0]
knn_k_values = [1, 3, 5, 7, 9]
