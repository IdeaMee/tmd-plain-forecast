# ค่าตั้งของท่อประมวลผล (พาธสัมพัทธ์กับราก repo) ค่าของโมเดลอยู่ใน [classify]
pipeline_version = "0.1.0"
max_upload_bytes = 4194304

[paths]
raw = "data/raw"
labeled = "data/labeled"
processed = "data/processed"
models = "models"

# แบ่งชุดตามวัน (Phase 2.1): ทดสอบ = วันล่าสุด test_days วัน, เว้น gap_days, dev = dev_days วัน, เว้น gap_days, ที่เหลือ = ฝึก
[split]
test_days = 7
dev_days = 2
gap_days = 1

[labeling]
# Phase 2.2: สุ่มให้ผู้ใช้ติดป้ายซ้ำแบบไม่เห็นป้าย
blind_fraction = 0.2
blind_seed = 20261117

[generic]
# Phase 10.3 โหมดทั่วไปของ /demo (เอกสาร TMD ที่ไม่ใช่ชนิดที่สรุปเต็ม)
# ป้ายเป็น "ไม่แน่ใจ" เมื่อความมั่นใจต่ำกว่าค่านี้ หรือคำในหน่วยอยู่ในคลังคำของโมเดลน้อยกว่า min_known_ratio
uncertain_below = 0.8
min_known_ratio = 0.5
# ไม่มีชื่อกรมในเอกสาร แต่คำเฉลี่ยต่อหน่วยอยู่ในคลังคำพยากรณ์ตั้งแต่สัดส่วนนี้ (และมีหน่วยพอ) = ยังนับว่าเหมือนเอกสาร TMD
# วัด 2026-11-18: แผนที่สรุปรายสัปดาห์ 95 ไฟล์ (ไม่มีชื่อกรม) 0.489-0.758, สไลด์วิชา 11 ไฟล์ 0.102-0.171
tmd_vocab_ratio = 0.35
tmd_vocab_min_units = 5
# บรรทัดสั้นไม่เกินนี้ที่ตามด้วยเนื้อความ = หัวข้อ
heading_max_chars = 40
# เพดานผล: จำนวนหน่วย และขนาด JSON (ตัดหน่วยท้ายแล้วใส่ truncated)
max_units = 400
max_json_bytes = 1000000

[classify]
# Phase 2.4: ค่าที่ลองบนชุด dev เท่านั้น · m ของ Naive Bayes = ตัวคูณ x |Vocabulary| (1.0 = add-one)
nb_m_factors = [0.05, 0.1, 0.25, 0.5, 1.0, 2.0]
knn_k_values = [1, 3, 5, 7, 9]
